[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coverage>=7.6.12",
    "fastapi[standard]>=0.115.11",
    "logfire[fastapi]>=3.7.1",
    "mangum>=0.19.0",
    "mypy>=1.15.0",
